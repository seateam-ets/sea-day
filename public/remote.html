<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#090a13">
  <title>Télécommande · SEA Day</title>
  <link rel="icon" href="/assets/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/mobile.css">
</head>
<body>
  <main class="m">
    <header class="m-head"><img src="/assets/eteamsys-logo.png" alt="" class="m-logo"><b>Télécommande</b><span id="pos" class="muted"></span></header>
    <section class="m-card">
      <div class="kicker" id="ag"></div>
      <h1 id="title"></h1>
      <p id="notes" class="muted"></p>
    </section>
    <section id="ctx"></section>
    <nav class="m-nav">
      <button id="prev">←</button>
      <button id="next" class="primary">Suivante →</button>
    </nav>
    <details class="m-card"><summary>Aller à une slide</summary><div id="list" class="m-list"></div></details>
    <details class="m-card"><summary>Réglages</summary>
      <p class="muted">Après des tests, remettre la journée à zéro : réponses du tour de table, décisions, votes, idées, quiz, joueurs et minuteurs.</p>
      <div class="m-grid"><button id="resetQuiz">Remettre le quiz à zéro</button><button id="resetAll" class="danger">Tout remettre à zéro</button></div>
      <p id="resetMsg" class="muted"></p>
    </details>
  </main>
  <script type="module">
    import { store, gate, esc } from "/js/store.js";
    import { SLIDES, loadQuiz, quizAction, gameAction, exportReport } from "/js/slides.js";
    import { AGENDA, GAMES } from "/js/content.js";

    await gate(); const QUIZ = await loadQuiz(); store.start(1000);
    const $ = (id) => document.getElementById(id);
    const go = (i) => store.set({ slide: Math.max(0, Math.min(SLIDES.length - 1, i)) });
    $("prev").onclick = () => go(store.get("slide", 0) - 1);
    $("next").onclick = () => go(store.get("slide", 0) + 1);
    $("list").innerHTML = SLIDES.map((s, i) => `<button data-i="${i}">${String(i + 1).padStart(2, "0")} · ${esc(s.title)}</button>`).join("");
    $("list").onclick = (e) => { const b = e.target.closest("[data-i]"); if (b) go(+b.dataset.i); };
    const fmt = (ms) => { const s = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

    let lastSig = "";
    function draw() {
      const i = store.get("slide", 0), s = SLIDES[i];
      $("pos").textContent = `${i + 1}/${SLIDES.length}`;
      $("ag").textContent = AGENDA.find((a) => a.id === s.agenda)?.title || "";
      $("title").textContent = s.title;
      $("list").querySelectorAll("[data-i]").forEach((b) => b.classList.toggle("on", +b.dataset.i === i));
      $("notes").textContent = s.notes || "";
      const ctx = $("ctx");
      let html = "";
      if (s.id === "quiz") {
        const q = store.get("quiz", { i: -1 }); const T = store.get("quiz:teams", []);
        const cur = QUIZ[q.i];
        html = `<div class="m-card">
          ${cur ? `<div class="kicker">Q${cur.n} · ${esc(cur.theme)}</div><p><b>${esc(cur.text)}</b></p><p class="ok">✅ ${esc(cur.answer)}</p>` : `<p class="muted">${q.i < 0 ? "Intro du quiz" : "Classement final"}</p>`}
          <div class="m-grid"><button data-q="prev">← Préc.</button><button data-q="reveal" class="primary">Révéler</button><button data-q="next">Suiv. →</button></div>
          <div class="m-grid">${T.map((t, k) => `<button data-pt="${k}">+ ${esc(t.name)} <b>${t.score}</b></button>`).join("")}</div>
          <div class="m-grid"><button data-q="board">Classement</button><button data-q="reset" class="danger">Réinitialiser</button></div></div>`;
      } else if (s.id === "jeux") {
        const g = GAMES.find((x) => x.id === store.get("game:id", GAMES[0].id));
        const idx = store.get("game:card", null);
        html = `<div class="m-card">
          <div class="kicker">${esc(g.name)}</div>
          <div class="m-secret">${idx != null ? esc(g.cards[idx]).replace("|", "<small>Interdit :") + (g.cards[idx].includes("|") ? "</small>" : "") : "<span class='muted'>Aucune carte</span>"}</div>
          <div class="m-grid"><button data-g="draw" class="primary">Tirer</button><button data-g="reveal">Révéler</button><button data-g="start">Chrono</button></div>
          <div class="m-grid">${GAMES.map((x) => `<button data-gid="${x.id}" class="${x.id === g.id ? "on" : ""}">${esc(x.name)}</button>`).join("")}</div></div>`;
      } else if (s.kind === "pause") {
        html = `<div class="m-card"><div class="kicker">Minuteur</div><div class="m-grid">${[5, 10, 15, 30, 60].map((m) => `<button data-min="${m}">${m} min</button>`).join("")}<button data-min="0">Stop</button></div></div>`;
      } else if (s.id === "fin") {
        html = `<div class="m-card"><button data-export class="primary wide">Exporter le compte-rendu</button></div>`;
      }
      const sig = i + html;
      if (sig !== lastSig) { ctx.innerHTML = html; lastSig = sig; }
      ctx.querySelectorAll("[data-q]").forEach((b) => b.onclick = () => (b.dataset.q !== "reset" || confirm("Remettre le quiz à zéro ?")) && quizAction(b.dataset.q));
      ctx.querySelectorAll("[data-pt]").forEach((b) => b.onclick = () => quizAction("point", +b.dataset.pt));
      ctx.querySelectorAll("[data-g]").forEach((b) => b.onclick = () => gameAction(b.dataset.g));
      ctx.querySelectorAll("[data-gid]").forEach((b) => b.onclick = () => store.set({ "game:id": b.dataset.gid, "game:card": null, "game:used": [], "game:end": null, "game:revealed": false }));
      ctx.querySelectorAll("[data-min]").forEach((b) => b.onclick = () => store.set({ [`timer:${s.id}`]: +b.dataset.min ? Date.now() + b.dataset.min * 60000 : null }));
      ctx.querySelector("[data-export]")?.addEventListener("click", exportReport);
    }
    store.subscribe(draw);
    $("resetQuiz").onclick = () => confirm("Remettre le quiz à zéro (scores, réponses, joueurs) ?") && (quizAction("reset"),
      store.set(Object.fromEntries(Object.keys(store.state).filter((k) => k.startsWith("qp:")).map((k) => [k, null]))), $("resetMsg").textContent = "Quiz remis à zéro ✓");
    $("resetAll").onclick = async () => {
      if (!confirm("Tout effacer ? Les réponses, décisions, votes et scores de la journée seront supprimés.")) return;
      const keys = Object.keys(store.state);
      await store.set({ ...Object.fromEntries(keys.map((k) => [k, null])), slide: 0 });
      $("resetMsg").textContent = `Tout est remis à zéro ✓ (${keys.length} éléments effacés)`;
    };
  </script>
</body>
</html>
