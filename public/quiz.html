<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#090a13">
  <title>Quiz · SEA Day</title>
  <link rel="icon" href="/assets/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/mobile.css">
  <style>
    .qz-timer { font-family: var(--display); font-size: 44px; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; }
    .qz-timer.low { color: var(--orange); }
    .qz-bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
    .qz-bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--violet), var(--lilac)); transition: width .25s linear; }
    .qz-q { font-family: var(--display); font-size: 21px; line-height: 1.3; margin: 0; }
    .qz-opts { display: grid; gap: 10px; }
    .qz-opts.tf { grid-template-columns: 1fr 1fr; }
    .qz-opt { display: flex; gap: 12px; align-items: center; text-align: left; padding: 16px !important; font-size: 16px !important; min-height: 64px; }
    .qz-opt span { flex: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: rgba(255,255,255,.12); font-family: var(--display); font-size: 18px; }
    .qz-opt.sel { background: var(--violet) !important; border-color: var(--lilac) !important; }
    .qz-opt.right { background: rgba(34,197,94,.25) !important; border-color: var(--ok) !important; }
    .qz-opt.wrong { opacity: .45; }
    .qz-opt:disabled { cursor: default; }
    .qz-big { font-family: var(--display); font-size: 30px; text-align: center; margin: 6px 0; }
    .qz-team { display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
    .qz-team b { color: var(--lilac); }
    .qz-res { text-align: center; font-size: 22px; font-weight: 800; padding: 14px; border-radius: 14px; }
    .qz-res.ok { background: rgba(34,197,94,.2); color: #86efac; }
    .qz-res.ko { background: rgba(239,68,68,.15); color: #fca5a5; }
    .qz-rank { display: grid; gap: 8px; }
    .qz-rank div { display: flex; justify-content: space-between; padding: 12px 14px; border-radius: 12px; background: rgba(255,255,255,.05); }
    .qz-rank div.me { background: var(--violet); }
    textarea.qz-open { min-height: 110px; }
  </style>
</head>
<body>
  <main class="m">
    <header class="m-head"><img src="/assets/eteamsys-logo.png" alt="" class="m-logo"><b>Question pour un Champion SEA</b></header>
    <div id="app"></div>
  </main>
  <script type="module">
    import { store, gate, esc } from "/js/store.js";
    import { loadQuiz, quizPlayers } from "/js/slides.js";
    import { PEOPLE } from "/js/content.js";

    await gate(); const QUIZ = await loadQuiz(); store.start(900);
    const app = document.getElementById("app");
    let me = null; try { me = localStorage.getItem("seaday-me"); } catch {}
    const fmt = (ms) => { const x = Math.max(0, Math.ceil(ms / 1000)); return `${Math.floor(x / 60)}:${String(x % 60).padStart(2, "0")}`; };
    const teams = () => store.get("quiz:teams", [{ name: "Équipe ROAS", score: 0 }, { name: "Équipe CTR", score: 0 }, { name: "Équipe PMax", score: 0 }]);
    let openDraft = "", lastSig = "";

    function view() {
      const T = teams();
      const reg = me ? store.get(`qp:${me}`) : null;
      const s = store.get("quiz", { i: -1, revealed: false, board: false });

      // 1. qui es-tu ?
      if (!me) return { sig: "who", html: `<section class="m-card"><div class="kicker">Qui es-tu ?</div><div class="m-grid">${PEOPLE.map((p) => `<button data-me="${p.id}">${esc(p.name)}</button>`).join("")}</div></section>` };
      const name = PEOPLE.find((p) => p.id === me)?.name || me;
      // 2. quelle équipe ?
      if (!reg || T[reg.team] == null) return { sig: "team" + T.map((t) => t.name).join(), html: `
        <section class="m-card"><div class="kicker">Salut ${esc(name)} ! Choisis ton équipe</div>
        <div class="m-grid">${T.map((t, k) => `<button data-team="${k}">${esc(t.name)}<br><small class="muted">${quizPlayers().filter((p) => p.team === k).length} joueur(s)</small></button>`).join("")}</div>
        <button data-reset-me class="m-link">Ce n'est pas moi</button></section>` };
      const team = T[reg.team];
      const head = `<section class="m-card qz-team"><span>${esc(name)} · ${esc(team.name)}</span><b>${team.score} pt${Math.abs(team.score) > 1 ? "s" : ""}</b></section>`;

      // 3. classement / fin
      if (s.board || s.i >= QUIZ.length) {
        const sorted = T.map((t, k) => ({ ...t, k })).sort((a, b) => b.score - a.score);
        return { sig: "board" + JSON.stringify(T), html: head + `<section class="m-card"><div class="kicker">${s.i >= QUIZ.length ? "Classement final" : "Classement"}</div><div class="qz-rank">${sorted.map((t, r) => `<div class="${t.k === reg.team ? "me" : ""}"><span>${r + 1}. ${esc(t.name)}</span><b>${t.score} pts</b></div>`).join("")}</div></section>` };
      }
      // 4. attente du lancement
      if (s.i < 0) return { sig: "wait" + reg.team + JSON.stringify(T), html: head + `<section class="m-card"><p class="qz-big">C'est bon, tu es inscrit·e !</p><p class="muted" style="text-align:center">Regarde l'écran : le quiz commence bientôt.</p><button data-change-team>Changer d'équipe</button></section>` };

      // 5. question
      const q = QUIZ[s.i];
      const end = store.get("quiz:end");
      const locked = s.revealed || !end || end <= Date.now();
      const mine = store.get(`qa:${s.i}:${reg.team}`);
      const good = q.options.find((o) => o.correct)?.key;
      let body;
      if (q.type === "open") {
        body = s.revealed
          ? `<p class="qz-big">Réponse</p><p>${esc(q.answer)}</p>${mine ? `<p class="muted">Votre réponse : « ${esc(mine.a)} »</p>` : ""}<p class="muted">L'animateur attribue les points.</p>`
          : `<textarea class="qz-open" data-open placeholder="La réponse de l'équipe…" ${locked ? "disabled" : ""}>${esc(mine?.a ?? openDraft)}</textarea>
             <button class="primary" data-send ${locked ? "disabled" : ""}>${mine ? "Modifier la réponse" : "Envoyer la réponse"}</button>
             ${mine ? `<p class="muted">Envoyée par ${esc(PEOPLE.find((p) => p.id === mine.by)?.name || "l'équipe")} ✓</p>` : ""}`;
      } else {
        body = `<div class="qz-opts ${q.type === "tf" ? "tf" : ""}">${q.options.map((o) => {
            const cls = s.revealed ? (o.correct ? "right" : (mine?.a === o.key ? "wrong sel" : "wrong")) : (mine?.a === o.key ? "sel" : "");
            return `<button class="qz-opt ${cls}" data-ans="${o.key}" ${locked ? "disabled" : ""}><span>${o.key}</span>${esc(o.text)}</button>`;
          }).join("")}</div>
          ${s.revealed ? `<div class="qz-res ${mine?.a === good ? "ok" : "ko"}">${!mine ? "Pas de réponse" : mine.a === good ? `Bonne réponse ! +${q.points} pt${q.points > 1 ? "s" : ""}` : "Raté !"}</div>`
            : mine ? `<p class="muted">Réponse de l'équipe : <b>${esc(mine.a)}</b> (par ${esc(PEOPLE.find((p) => p.id === mine.by)?.name || "?")}). Tout le monde peut la changer jusqu'à la fin du temps.</p>` : ""}`;
      }
      return {
        sig: JSON.stringify([s, mine, reg, team.score, locked]),
        html: head + `<section class="m-card">
          <div class="kicker">Q${s.i + 1}/${QUIZ.length} · ${esc(q.theme)} · ${q.points} pt${q.points > 1 ? "s" : ""}</div>
          ${!s.revealed ? `<div class="qz-timer" data-t></div><div class="qz-bar"><i data-bar></i></div>` : ""}
          <p class="qz-q">${esc(q.text)}</p>${body}</section>`,
      };
    }

    function draw() {
      const v = view();
      if (v.sig !== lastSig) {
        const ta = app.querySelector("[data-open]"); if (ta) openDraft = ta.value;
        app.innerHTML = v.html; lastSig = v.sig; bind();
      }
    }
    function bind() {
      app.querySelectorAll("[data-me]").forEach((b) => b.onclick = () => { me = b.dataset.me; try { localStorage.setItem("seaday-me", me); } catch {} lastSig = ""; draw(); });
      app.querySelectorAll("[data-team]").forEach((b) => b.onclick = () => store.set({ [`qp:${me}`]: { team: +b.dataset.team } }));
      app.querySelector("[data-reset-me]")?.addEventListener("click", () => { me = null; try { localStorage.removeItem("seaday-me"); } catch {} lastSig = ""; draw(); });
      app.querySelector("[data-change-team]")?.addEventListener("click", () => store.set({ [`qp:${me}`]: null }));
      const s = store.get("quiz", {}); const reg = store.get(`qp:${me}`);
      app.querySelectorAll("[data-ans]").forEach((b) => b.onclick = () => {
        const end = store.get("quiz:end"); if (!end || end <= Date.now()) return;
        navigator.vibrate?.(30);
        store.set({ [`qa:${s.i}:${reg.team}`]: { a: b.dataset.ans, by: me } });
      });
      app.querySelector("[data-send]")?.addEventListener("click", () => {
        const v = app.querySelector("[data-open]").value.trim(); if (!v) return;
        openDraft = ""; store.set({ [`qa:${s.i}:${reg.team}`]: { a: v, by: me } });
      });
    }
    store.subscribe(draw);
    // timer + verrouillage à la fin du temps
    setInterval(() => {
      const end = store.get("quiz:end"); const el = app.querySelector("[data-t]"); const bar = app.querySelector("[data-bar]");
      const q = QUIZ[store.get("quiz", {}).i];
      if (el) { const left = end ? end - Date.now() : 0; el.textContent = end ? (left > 0 ? fmt(left) : "Temps écoulé") : ""; el.classList.toggle("low", left < 6000); }
      if (bar && q) { const tot = q.type === "open" ? 60000 : 30000; bar.style.width = `${end ? Math.max(0, Math.min(100, ((end - Date.now()) / tot) * 100)) : 0}%`; }
      draw();
    }, 250);
  </script>
</body>
</html>
